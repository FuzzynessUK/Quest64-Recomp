# Quest 64 Recompiled - Archipelago player template
# Generated by tools/archipelago_world.pl for Archipelago 0.6.7.
#
# Drop quest64.apworld in Archipelago/custom_worlds and this file in
# Archipelago/Players, then run ArchipelagoGenerate.

name: Player{number}
description: Default Quest 64 Recompiled Template
game: Quest 64 Recompiled
requires:
  version: 0.6.7

Quest 64 Recompiled:
  # DeathLink: when Brian dies, everyone else in the room with DeathLink on
  # dies too, and when any of them dies, Brian collapses and is sent back to
  # his last save point the same way a lost battle does.
  death_link:
    'false': 1
    'true': 0

  # Which groups of locations are Archipelago checks.
  #
  # chestsanity   the 88 treasure chests
  # giftsanity    the 16 NPCs who hand something over
  # enemysanity   defeating each of the 67 kinds of regular monster. One
  #               check a kind, sent the first time you beat one of them
  # spiritsanity  the 98 spirits. With this on a spirit sends a check
  #               instead of raising an element, and the element-choice
  #               screen comes back as the "Level Up" item.
  #
  # The 8 bosses are always checks.
  chestsanity:
    'true': 1
    'false': 0
  giftsanity:
    'true': 1
    'false': 0

  # With giftsanity on, the six wingsmiths still hand over their wings as
  # well as sending their check (once each).
  wingsmith_wings:
    'true': 1
    'false': 0

  # How many of each pair of wings go in the item pool: none (the default),
  # one, or two. No rule needs wings; the room left goes to filler.
  wings_in_pool:
    none: 1
    one: 0
    two: 0

  enemysanity:
    'true': 0
    'false': 1

  # Only with enemy_randomizer on (Randomizer section below): every one of the
  # 67 kinds of regular monster appears somewhere before Mammon's World.
  # Off, some kinds can be left out; a kind that appears nowhere is simply
  # not a check. Either way the seed knows where each monster is, and each
  # one's check is in logic from the earliest area it appears in.
  ensure_all_enemies:
    'true': 1
    'false': 0
  spiritsanity:
    'true': 1
    'false': 0

  # false keeps the boss rewards on their bosses (the Earth Orb, Wind Jade,
  # Water Jewel and Fire Ruby), and the Eletale's Book and Dark Gaol Key
  # with the Shannons who give them. true shuffles them with everything else.
  shuffle_orbs:
    'false': 1
    'true': 0

  # Extra "Level Up" items on top of the one per spirit, 0 to 99. Nothing is
  # added to the game world for these - they arrive like any other item and
  # bring up the element-choice screen - so a run can hand out more element
  # levels than the game has spirits. They replace filler, not add to the
  # pool.
  extra_level_ups: 0

  # What it takes to open the way into Mammon's World. In the vanilla game
  # the last door of the final staircase wants the Eletale's Book; any other
  # choice replaces the Book - the door opens once the condition is met, the
  # Book leaves the pool and the Shannon who hands it over becomes a gift
  # check of her own.
  #
  # vanilla       the Book, the game's own gate
  # all_bosses    every boss before Mammon: Solvaring, Zelse, Nepty,
  #               Shilf, Fargo, Guilty and Beigis
  # all_monsters  one of each of the 67 kinds of regular monster.
  #               Turns enemysanity on, because the server is what keeps the
  #               count - a monster leaves nothing in the save to read back
  # both          all of it
  mammon_portal:
    vanilla: 1
    all_bosses: 0
    all_monsters: 0
    both: 0

  # Bosses are not in the game until their Soul turns up: an empty arena you
  # walk straight through, the same state the game uses for a boss already
  # beaten. The Soul is an Archipelago item, not one the game knows about, so
  # it can be anywhere in the multiworld. Whether a boss is there is settled
  # as his arena loads, so a Soul that arrives while you are standing in one
  # takes effect the next time you walk in. With Souls on, everything the
  # four gems lock (doors, boats, teleporters) is open from the start;
  # the Dark Gaol Key still locks the endgame, and so does the Eletale's
  # Book unless mammon_portal replaces it.
  #
  # off           every boss is where the game puts him
  # bosses        the seven before Mammon need Souls
  # with_mammon   Mammon needs one as well, so the last fight waits on it
  boss_souls:
    off: 1
    bosses: 0
    with_mammon: 0

  # What finishes the run.
  #
  # mammon      beat King Mammon
  # page_hunt   find pages_required Torn Pages of the Eletale's Book (set
  #             pages_required below, anywhere from 5 to 100). The moment the
  #             last one is in your bag, the game fades into the credits and
  #             the goal is done
  goal:
    mammon: 1
    page_hunt: 0

  # Page Hunt: how many Torn Pages finish the run (5 to 100). They take the
  # place of filler, then wings, then Level Ups; if there is still not room
  # for them all the seed will not generate and says why, so switch on more
  # of the *sanity options for a big hunt.
  pages_required: 20

  # Page Hunt: where the Torn Pages can be.
  #
  # quest64_only       only in Quest 64's own locations
  # all_games          anywhere in the multiworld
  # other_games_only   only in the other games' locations; needs at least one
  #                    other game in the seed with room for them all
  page_placement:
    quest64_only: 0
    all_games: 1
    other_games_only: 0

  # Traps take the place of filler (herbs, potions and the like) in your
  # pool, as Ocarina of Time's Ice Traps do. The pool does not grow, and a
  # trap never replaces a gem, the Book, the key, a Soul, wings or a Level Up.
  #
  # no_traps            none
  # normal              about 1 filler item in 10
  # extra               about 1 in 4
  # mayhem              about half
  # onslaught           every filler item
  # custom_count        exactly trap_count traps (as many as there is filler for)
  # custom_percentage   trap_percentage percent of the filler
  traps:
    no_traps: 1
    normal: 0
    extra: 0
    mayhem: 0
    onslaught: 0
    custom_count: 0
    custom_percentage: 0

  # With traps: custom_count, how many (0 to 300).
  trap_count: 10

  # With traps: custom_percentage, the share of the filler (0 to 100).
  trap_percentage: 20

  # Which kinds of trap can turn up. With all four off there are no traps.
  #
  # Death Trap   Brian falls and is sent back to his last save point, as a
  #              DeathLink death does. Held until a won battle's rewards are
  #              in hand. The most brutal, so it has its own amount:
  #                off      none
  #                rare     a quarter as likely as each other kind (about 1
  #                         trap in 13 with all four on)
  #                normal   as likely as the others
  #                custom   exactly death_trap_count of them
  # HP Trap      HP drops by half of max HP; it stops at 1, never kills.
  # MP Trap      MP drops by half of max MP.
  # Ice Trap     Brian is frozen in ice for five seconds, in the field or in
  #              battle: no moving, attacking, casting, talking or opening.
  death_traps:
    off: 0
    rare: 1
    normal: 0
    custom: 0

  # With death_traps: custom, exactly this many of the traps are Death Traps
  # (0 to 50), the rest drawn from the other kinds switched on.
  death_trap_count: 1

  hp_traps:
    'true': 1
    'false': 0
  mp_traps:
    'true': 1
    'false': 0
  ice_traps:
    'true': 1
    'false': 0


  # ==== Randomizer
  # These three groups are the game's own settings. When the game is
  # connected to the room as it starts, it plays with these instead of
  # its menus, and hides the Randomizer and Enhancements menus.

  # Shuffled Spells: Shuffles which spell each element teaches, with the spell
  # damage rebalance, Invalidity, and the fixes that keep shuffled spell
  # combinations from crashing.
  shuffle_spells:
    'false': 1
    'true': 0

  # Early Healing: A healing spell is guaranteed early.
  early_healing:
    'false': 1
    'true': 0

  # Enemy Randomizer: Any monster set can land in any area, and every monster
  # is scaled to the area it appears in.
  enemy_randomizer:
    'false': 1
    'true': 0

  # Shuffle Boss Order: The seven bosses before Mammon swap arenas.
  shuffle_boss_order:
    'false': 1
    'true': 0

  # Randomize Guilty Element: Guilty takes a random element instead of his
  # own.
  random_guilty_element:
    'false': 1
    'true': 0

  # Element Cap 99: Each element can be raised to 99 instead of 50, by
  # spirits, level-ups and Level Up items alike.
  element_cap_99:
    'false': 1
    'true': 0

  # ==== Enhancements

  # Double Experience: Levels need half the experience. both: level (combat)
  # experience and the hidden experience that raises HP, MP, Agility and
  # Defense; stat_only: just the hidden stat experience; level_only: just the
  # level experience.
  double_exp:
    off: 1
    both: 0
    stat_only: 0
    level_only: 0

  # JP Healing Amounts: Healing Lv2 restores 16 HP instead of 8, as in the
  # Japanese release.
  jp_healing:
    'true': 1
    'false': 0

  # JP Magic Barrier: Magic Barrier holds two turns longer, as in the Japanese
  # release.
  jp_magic_barrier:
    'true': 1
    'false': 0

  # JP Boss MP Rewards: Beating a boss raises max MP as well as max HP and
  # refills both, by the amounts the Japanese release uses (5, 5, 5, 10, 10,
  # 15, 15).
  jp_boss_mp_rewards:
    'true': 1
    'false': 0

  # Fast MP Recovery: MP comes back as you walk at the fastest rate, as in
  # Easy Mode.
  fast_mp_recovery:
    'true': 1
    'false': 0

  # JP Stat Up Effect: A colour burst over Brian when a stat rises, as in the
  # Japanese release.
  jp_stat_up_effect:
    'true': 1
    'false': 0

  # Exit from Anywhere: The bound Exit Spell control warps out of an area
  # without the spell or the MP.
  exit_from_anywhere:
    'true': 1
    'false': 0

  # Fast Walking: Brian walks 50% faster.
  fast_walking:
    'true': 1
    'false': 0

  # Text Improvements: Merrow's clearer wording for a number of the game's
  # messages.
  text_improvements:
    'true': 1
    'false': 0

  # Faster Areas: Fast Monastery, Fast Blue Cave, Fast Shamwood and Fast
  # Mammon's World together: the long empty stretches are skipped.
  faster_areas:
    'true': 1
    'false': 0

  # Wings Never Expire: Using a pair of wings does not use them up.
  wings_never_expire:
    'true': 1
    'false': 0

  # No Enemy Drop Limit: Monsters keep dropping items past the vanilla limit.
  no_enemy_drop_limit:
    'true': 1
    'false': 0

  # ==== Cosmetics

  # Text Palette: The colour of the text boxes.
  text_palette:
    off: 1
    randomized: 0

  # Staff Palette: The colour of Brian's staff.
  staff_palette:
    off: 1
    randomized: 0

  # Cloak Colour: The colour of Brian's cloak.
  cloak_colour:
    off: 1
    randomized: 0

  # Brian's Clothes: The colours of Brian's clothes.
  brian_clothes:
    off: 1
    randomized: 0

  # Spell Palettes: The colours of the spell effects.
  spell_palettes:
    off: 1
    randomized: 0
  progression_balancing: 50
  accessibility: full
