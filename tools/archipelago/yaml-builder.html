<script>
"use strict";
const DATA = {"groups":["Game Options","Goal","Checks","Items and World","Traps","Randomizer","Enhancements","Cosmetics"],"options":[{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":0,"key":"death_link","kind":"toggle","scalar":false,"tip":"DeathLink: when Brian dies, everyone else in the room with DeathLink on\ndies too, and when any of them dies, Brian collapses and is sent back to\nhis last save point the same way a lost battle does.","title":"Death Link"},{"choices":[],"group":0,"key":"progression_balancing","kind":"range","max":99,"min":0,"scalar":true,"tip":"How hard the generator tries to give you your progression items early, rather than leave them to arrive late in the run. 0 is off, 50 the default, 99 the most.","title":"Progression Balancing"},{"choices":[{"label":"Full","name":"full"},{"label":"Minimal","name":"minimal"}],"group":0,"key":"accessibility","kind":"choice","scalar":true,"tip":"full: every location can be reached, so every check is possible.\nminimal: only what is needed to finish is guaranteed; some locations may be unreachable.","title":"Accessibility"},{"choices":[{"label":"Mammon","name":"mammon"},{"label":"Page hunt","name":"page_hunt"}],"group":1,"key":"goal","kind":"choice","scalar":false,"tip":"What finishes the run.\n\nmammon      beat King Mammon\npage_hunt   find pages_required Torn Pages of the Eletale's Book. Anywhere\n            from 5 to 100. The\n            moment the last one is in your bag the game fades into the\n            credits and the goal is done.","title":"Goal"},{"choices":[{"label":"Vanilla","name":"vanilla"},{"label":"All bosses","name":"all_bosses"},{"label":"All monsters","name":"all_monsters"},{"label":"Both","name":"both"},{"label":"All pages","name":"all_pages"},{"label":"Bosses and pages","name":"bosses_and_pages"},{"label":"Bosses monsters pages","name":"bosses_monsters_pages"},{"label":"All orbs","name":"all_orbs"},{"label":"Some orbs","name":"some_orbs"}],"group":1,"key":"mammon_portal","kind":"choice","scalar":false,"tip":"What it takes to open the way into Mammon's World.\n\nThe last door of the final staircase, in Baragoon Moor, wants the\nEletale's Book in the vanilla game. Any other choice replaces the Book:\nthe door opens once the condition is met, the Book is left out of the\npool, and the Shannon who would have handed it over is a gift check of\nher own (even with giftsanity off).\n\nvanilla       the Book, as the game has it\n\nall_bosses    every boss before Mammon - Solvaring, Zelse, Nepty, Shilf,\n              Fargo, Guilty and Beigis - has to be beaten. They are\n              checks whatever else is switched on, so this costs nothing\n              extra to track.\nall_monsters  one of each of the 67 kinds of regular monster has to be\n              beaten. This needs enemysanity, because the count is kept\n              by the server: a monster leaves nothing behind in the save\n              to read back after a reload. Turning this on turns\n              enemysanity on with it.\nboth          all_bosses and all_monsters.\n\nall_pages               pages_required Torn Pages of the Eletale's Book\n                        have to be in your bag. The pages go into the\n                        pool as they do for a Page Hunt (pages_required\n                        and page_placement say how many and where), but\n                        the run still ends with Mammon. Needs goal\n                        mammon.\nbosses_and_pages        all_bosses and all_pages.\nbosses_monsters_pages   all_bosses, all_monsters and all_pages.\n\nall_orbs                the four orbs - Earth Orb, Wind Jade, Water Jewel\n                        and Fire Ruby - have to be in your bag.\nsome_orbs               orbs_required of the four orbs, any of them.\n                        With boss_items progressive the orbs are the\n                        first four Progressive Boss Items, so it is that\n                        many of those.","title":"Mammon's World Portal"},{"choices":[],"group":1,"key":"orbs_required","kind":"range","max":4,"min":1,"scalar":true,"tip":"How many of the four orbs (Earth Orb, Wind Jade, Water Jewel, Fire\nRuby) open Mammon's World when Mammon's World Portal is some_orbs.","title":"Orbs Required"},{"choices":[],"group":1,"key":"pages_required","kind":"range","max":100,"min":5,"scalar":true,"tip":"How many Torn Pages finish a Page Hunt, or open Mammon's World when\nMammon's World Portal asks for pages.","title":"Pages Required"},{"choices":[{"label":"Quest64 only","name":"quest64_only"},{"label":"All games","name":"all_games"},{"label":"Other games only","name":"other_games_only"}],"group":1,"key":"page_placement","kind":"choice","scalar":false,"tip":"Where the Torn Pages can be.\n\nquest64_only       only in Quest 64's own locations\nall_games          anywhere in the multiworld\nother_games_only   only in the other games' locations (needs at least\n                   one other game in the seed, with room for them)","title":"Page Placement"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":2,"key":"chestsanity","kind":"toggle","scalar":false,"tip":"Treasure chests are Archipelago checks.","title":"Chestsanity"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":2,"key":"giftsanity","kind":"toggle","scalar":false,"tip":"NPCs who hand over an item are Archipelago checks: the gift NPCs, the\ntwo endgame Shannons and the six wingsmiths (Melrode to Brannoch). Each\ngives its check once, the first time you talk to them, whatever is in\nyour bag - and no item, except that with Wings normal a wingsmith also\nhands over his own town's wings.","title":"Giftsanity"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":2,"key":"enemysanity","kind":"toggle","scalar":false,"tip":"Defeating a kind of regular monster is an Archipelago check. One check\nper kind, sent the first time you beat one of them and never again -\nthere are 67 kinds, so 67 checks, and a lot of hunting.","title":"Enemysanity"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":2,"key":"ensure_all_enemies","kind":"toggle","scalar":false,"tip":"Only matters with the Enemy Randomizer on. Every one of the 67 kinds of\nregular monster appears somewhere before Mammon's World: each of the six\nmonster sets is given at least one area with room for all of it.\n\nOff, a set can be left out entirely, or only partly fit the areas it\nlands in. A monster that appears nowhere is simply not a check, and the\n\"all monsters\" portal only counts the ones that do appear.","title":"Ensure All Enemies Appear"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":2,"key":"spiritsanity","kind":"toggle","scalar":false,"tip":"Spirits are Archipelago checks. With this on a spirit no longer raises\nan element itself - it sends a check, and the element-choice screen comes\nback as the \"Level Up\" item, from wherever Archipelago put it.","title":"Spiritsanity"},{"choices":[],"group":2,"key":"extra_level_ups","kind":"range","max":99,"min":0,"scalar":true,"tip":"Extra \"Level Up\" items in the pool, on top of the one per spirit.\n\nThese have no spirit behind them - nothing is added to the game world.\nThey simply arrive like any other item and bring up the element-choice\nscreen, so a run can hand out more element levels than Quest 64 has\nspirits for. They take the place of filler, so the pool does not grow.","title":"Extra Level Ups"},{"choices":[{"label":"Normal","name":"normal"},{"label":"Shuffled","name":"shuffled"},{"label":"Progressive","name":"progressive"}],"group":3,"key":"wings","kind":"choice","scalar":false,"tip":"Where the six pairs of wings come from. No rule needs wings: they are\nfor getting about.\n\nnormal        each wingsmith hands over his own town's wings, as in the\n              game, once per save. With giftsanity on he also sends a\n              check; with it off he gives only the wings\nshuffled      one of each pair is in the item pool. The wingsmiths give\n              no wings: with giftsanity on they send a check, with it\n              off they give nothing\nprogressive   six \"Progressive Wings\" are in the pool instead, each the\n              next pair in town order: White, Yellow, Blue, Green, Red,\n              Black. The wingsmiths give no wings: with giftsanity on\n              they send a check, with it off they give nothing","title":"Wings"},{"choices":[{"label":"None","name":"none"},{"label":"One","name":"one"},{"label":"Two","name":"two"}],"group":3,"key":"wings_in_pool","kind":"choice","scalar":false,"tip":"Extra copies of each pair of wings in the item pool, on top of what\nWings puts there (with Wings progressive, as more Progressive Wings,\nwhich go round the six again). They take the place of filler.\n\nnone          no extra wings (the default)\none           one more of each\ntwo           two more of each","title":"Extra Wings in Pool"},{"choices":[{"label":"Normal","name":"normal"},{"label":"Shuffled","name":"shuffled"},{"label":"Progressive","name":"progressive"}],"group":3,"key":"boss_items","kind":"choice","scalar":false,"tip":"The six items the way on waits for: the Earth Orb, Wind Jade, Water\nJewel and Fire Ruby the bosses drop, and the Eletale's Book and Dark Gaol\nKey the Shannons hand over.\n\nnormal        each stays where the game puts it, on its boss or Shannon\nshuffled      they are shuffled with everything else\nprogressive   the pool has a \"Progressive Boss Item\" for each instead,\n              and each one is the next of Earth Orb, Wind Jade, Water\n              Jewel, Fire Ruby, Eletale's Book, Dark Gaol Key - so they\n              always arrive in story order. With a Mammon's World Portal\n              condition the Book is not in the game and there are five.","title":"Orbs / Boss Items"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":3,"key":"open_world","kind":"toggle","scalar":false,"tip":"The doors, boats and teleporters the Earth Orb, Wind Jade, Water Jewel\nand Fire Ruby open are open from the start, so the world can be explored\nin any order. The Dark Gaol Key still locks what it locks, and so does the\nEletale's Book unless Mammon's World Portal replaces it.","title":"Open World"},{"choices":[{"label":"Off","name":"off"},{"label":"Bosses","name":"bosses"},{"label":"With mammon","name":"with_mammon"}],"group":3,"key":"boss_souls","kind":"choice","scalar":false,"tip":"Bosses are not in the game until their Soul turns up.\n\nA boss whose Soul has not arrived is not loaded and not placed: his\narena is empty and you walk straight through it. It is the same state\nthe game itself uses for a boss you have already beaten, so nothing is\nleft half-there to bump into. The Soul is an Archipelago item, not\nsomething the game knows about, so it can be anywhere in the multiworld.\n\nWhether a boss is there is settled as his arena loads, so a Soul that\narrives while you are standing in the arena takes effect when you next\nwalk in.\n\nSouls open nothing else: the gem locks stay locked unless Open World\nis on. With Orbs / Boss Items normal, a gem then waits on its boss's\nSoul as well as the boss.\n\nbosses        the seven before Mammon get Souls\nwith_mammon   Mammon as well, so the last fight waits on his Soul too","title":"Boss Souls"},{"choices":[{"label":"No traps","name":"no_traps"},{"label":"Normal","name":"normal"},{"label":"Extra","name":"extra"},{"label":"Mayhem","name":"mayhem"},{"label":"Onslaught","name":"onslaught"},{"label":"Custom count","name":"custom_count"},{"label":"Custom percentage","name":"custom_percentage"}],"group":4,"key":"traps","kind":"choice","scalar":false,"tip":"How many traps take the place of filler (herbs, potions and the like)\nin your pool, in the style of Ocarina of Time's Ice Traps. The pool does\nnot grow: a trap always replaces a filler item, never a gem, the Book,\nthe key, a Soul, a pair of wings or a Level Up. Which kinds can appear\nis set by the four trap options below.\n\nno_traps            none\nnormal              about 1 filler item in 10 is a trap\nextra               about 1 in 4\nmayhem              about half\nonslaught           every filler item\ncustom_count        exactly trap_count traps (as many as there is filler for)\ncustom_percentage   trap_percentage percent of the filler","title":"Traps"},{"choices":[],"group":4,"key":"trap_count","kind":"range","max":300,"min":0,"scalar":true,"tip":"How many traps, when Traps is custom_count.","title":"Trap Count"},{"choices":[],"group":4,"key":"trap_percentage","kind":"range","max":100,"min":0,"scalar":true,"tip":"What percentage of the filler becomes traps, when Traps is\ncustom_percentage.","title":"Trap Percentage"},{"choices":[{"label":"Off","name":"off"},{"label":"Rare","name":"rare"},{"label":"Normal","name":"normal"},{"label":"Custom","name":"custom"}],"group":4,"key":"death_traps","kind":"choice","scalar":false,"tip":"Death Trap: Brian falls, the way a DeathLink death makes him, and is\nsent back to his last save point. It waits until a battle is won and its\nrewards are in hand, like DeathLink. The most brutal kind, so it has its\nown amount.\n\noff      none\nrare     a quarter as likely as each other kind (about 1 trap in 13\n         with all four kinds on)\nnormal   as likely as each other kind\ncustom   exactly death_trap_count of the traps (as many as there are\n         traps for); the rest come from the other kinds","title":"Death Traps"},{"choices":[],"group":4,"key":"death_trap_count","kind":"range","max":50,"min":0,"scalar":true,"tip":"How many Death Traps, when Death Traps is custom.","title":"Death Trap Count"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":4,"key":"hp_traps","kind":"toggle","scalar":false,"tip":"HP Trap: HP drops by half of max HP. It never kills: it stops at 1.","title":"HP Traps"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":4,"key":"mp_traps","kind":"toggle","scalar":false,"tip":"MP Trap: MP drops by half of max MP.","title":"MP Traps"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":4,"key":"ice_traps","kind":"toggle","scalar":false,"tip":"Ice Trap: Brian is frozen in a block of ice for five seconds, in the\nfield or in battle. He cannot move, attack, cast, talk or open anything\nuntil it melts.","title":"Ice Traps"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":5,"key":"shuffle_spells","kind":"toggle","scalar":false,"tip":"Randomizer. Shuffles which spell each element teaches, with the spell\ndamage rebalance, Invalidity, and the fixes that keep shuffled spell\ncombinations from crashing.","title":"Shuffled Spells"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":5,"key":"early_healing","kind":"toggle","scalar":false,"tip":"Randomizer. A healing spell is guaranteed early.","title":"Early Healing"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":5,"key":"enemy_randomizer","kind":"toggle","scalar":false,"tip":"Randomizer. Any monster set can land in any area, and every monster\nis scaled to the area it appears in.","title":"Enemy Randomizer"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":5,"key":"shuffle_boss_order","kind":"toggle","scalar":false,"tip":"Randomizer. The seven bosses before Mammon swap arenas.","title":"Shuffle Boss Order"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":5,"key":"random_guilty_element","kind":"toggle","scalar":false,"tip":"Randomizer. Guilty takes a random element instead of his own.","title":"Randomize Guilty Element"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":5,"key":"element_cap_99","kind":"toggle","scalar":false,"tip":"Randomizer. Each element can be raised to 99 instead of 50, by\nspirits, level-ups and Level Up items alike.","title":"Element Cap 99"},{"choices":[{"label":"Off","name":"off"},{"label":"Both","name":"both"},{"label":"Stat only","name":"stat_only"},{"label":"Level only","name":"level_only"}],"group":6,"key":"double_exp","kind":"choice","scalar":false,"tip":"Enhancements. Levels need half the experience. both: level (combat)\nexperience and the hidden experience that raises HP, MP, Agility and\nDefense; stat_only: just the hidden stat experience; level_only: just\nthe level experience.","title":"Double Experience"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"jp_healing","kind":"toggle","scalar":false,"tip":"Enhancements. Healing Lv2 restores 16 HP instead of 8, as in the\nJapanese release.","title":"JP Healing Amounts"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"jp_magic_barrier","kind":"toggle","scalar":false,"tip":"Enhancements. Magic Barrier holds two turns longer, as in the\nJapanese release.","title":"JP Magic Barrier"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"jp_boss_mp_rewards","kind":"toggle","scalar":false,"tip":"Enhancements. Beating a boss raises max MP as well as max HP and\nrefills both, by the amounts the Japanese release uses (5, 5, 5, 10, 10,\n15, 15).","title":"JP Boss MP Rewards"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"fast_mp_recovery","kind":"toggle","scalar":false,"tip":"Enhancements. MP comes back as you walk at the fastest rate, as in\nEasy Mode.","title":"Fast MP Recovery"},{"choices":[{"label":"Off","name":"false"},{"label":"On","name":"true"}],"group":6,"key":"real_time_combat","kind":"toggle","scalar":false,"tip":"Enhancements. Real time battles instead of turn based: Brian moves,\nattacks and casts whenever he likes, and the monsters act on timers of\ntheir own.","title":"Real Time Combat"},{"choices":[{"label":"Brian","name":"brian"},{"label":"Leonardo","name":"leonardo"}],"group":6,"key":"character","kind":"choice","scalar":false,"tip":"Enhancements. Who you play as. leonardo: the blond knight of Normoon\nand Brannoch Castle, with his own cape, moving with all of Brian's\nanimations; the Leonardo you meet becomes Brian.","title":"Character"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"repel","kind":"toggle","scalar":false,"tip":"Enhancements. Start with a Repel: use it in the field to switch\nrandom battles off, use it again to switch them back on. Its icon shows\nover Brian while it is on.","title":"Repel"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"jp_stat_up_effect","kind":"toggle","scalar":false,"tip":"Enhancements. A colour burst over Brian when a stat rises, as in the\nJapanese release.","title":"JP Stat Up Effect"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"exit_from_anywhere","kind":"toggle","scalar":false,"tip":"Enhancements. The bound Exit Spell control warps out of an area\nwithout the spell or the MP.","title":"Exit from Anywhere"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"fast_walking","kind":"toggle","scalar":false,"tip":"Enhancements. Brian walks 50% faster.","title":"Fast Walking"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"text_improvements","kind":"toggle","scalar":false,"tip":"Enhancements. Merrow's clearer wording for a number of the game's\nmessages.","title":"Text Improvements"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"faster_areas","kind":"toggle","scalar":false,"tip":"Enhancements. Fast Monastery, Fast Blue Cave, Fast Shamwood and Fast\nMammon's World together: the long empty stretches are skipped.","title":"Faster Areas"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"wings_never_expire","kind":"toggle","scalar":false,"tip":"Enhancements. Using a pair of wings does not use them up.","title":"Wings Never Expire"},{"choices":[{"label":"On","name":"true"},{"label":"Off","name":"false"}],"group":6,"key":"no_enemy_drop_limit","kind":"toggle","scalar":false,"tip":"Enhancements. Monsters keep dropping items past the vanilla limit.","title":"No Enemy Drop Limit"},{"choices":[{"label":"Off","name":"off"},{"label":"Randomized","name":"randomized"}],"group":7,"key":"text_palette","kind":"choice","scalar":false,"tip":"Cosmetics. The colour of the text boxes.","title":"Text Palette"},{"choices":[{"label":"Off","name":"off"},{"label":"Randomized","name":"randomized"}],"group":7,"key":"staff_palette","kind":"choice","scalar":false,"tip":"Cosmetics. The colour of Brian's staff.","title":"Staff Palette"},{"choices":[{"label":"Off","name":"off"},{"label":"Randomized","name":"randomized"}],"group":7,"key":"cloak_colour","kind":"choice","scalar":false,"tip":"Cosmetics. The colour of Brian's cloak.","title":"Cloak Colour"},{"choices":[{"label":"Off","name":"off"},{"label":"Randomized","name":"randomized"}],"group":7,"key":"brian_clothes","kind":"choice","scalar":false,"tip":"Cosmetics. The colours of Brian's clothes.","title":"Brian's Clothes"},{"choices":[{"label":"Off","name":"off"},{"label":"Randomized","name":"randomized"}],"group":7,"key":"spell_palettes","kind":"choice","scalar":false,"tip":"Cosmetics. The colours of the spell effects.","title":"Spell Palettes"}],"template":["# Quest 64 Recompiled - Archipelago player template","# Generated by tools/archipelago_world.pl for Archipelago 0.6.7.","#","# Drop quest64.apworld in Archipelago/custom_worlds and this file in","# Archipelago/Players, then run ArchipelagoGenerate.","","name: Player{number}","description: Default Quest 64 Recompiled Template","game: Quest 64 Recompiled","requires:","  version: 0.6.7","","Quest 64 Recompiled:","  # DeathLink: when Brian dies, everyone else in the room with DeathLink on","  # dies too, and when any of them dies, Brian collapses and is sent back to","  # his last save point the same way a lost battle does.","  death_link:","    'false': 1","    'true': 0","","  # Which groups of locations are Archipelago checks.","  #","  # chestsanity   the 88 treasure chests","  # giftsanity    the 16 NPCs who hand something over, the six wingsmiths","  #               (Melrode to Brannoch) and the two endgame Shannons among","  #               them. Each sends its check the first time you talk to it.","  #               What a wingsmith hands over as well is up to wings, below","  # enemysanity   defeating each of the 67 kinds of regular monster. One","  #               check a kind, sent the first time you beat one of them","  # spiritsanity  the 98 spirits. With this on a spirit sends a check","  #               instead of raising an element, and the element-choice","  #               screen comes back as the \"Level Up\" item.","  #","  # The 8 bosses are always checks.","  chestsanity:","    'true': 1","    'false': 0","  giftsanity:","    'true': 1","    'false': 0","","  # Where the six pairs of wings come from. No rule needs wings.","  # normal        each wingsmith hands over his own town's wings, as in the","  #               game, once per save. With giftsanity on he also sends a","  #               check; with it off he gives only the wings","  # shuffled      one of each pair in the item pool. The wingsmiths give no","  #               wings: with giftsanity on they send a check, with it off","  #               they give nothing","  # progressive   six \"Progressive Wings\" in the pool, each the next pair in","  #               town order (White, Yellow, Blue, Green, Red, Black). The","  #               wingsmiths give no wings: with giftsanity on they send a","  #               check, with it off they give nothing","  wings:","    normal: 1","    shuffled: 0","    progressive: 0","","  # Extra copies of each pair of wings in the pool, on top of what wings","  # puts there: none (the default), one or two. With wings progressive they","  # are more Progressive Wings, going round the six again. They replace","  # filler.","  wings_in_pool:","    none: 1","    one: 0","    two: 0","","  enemysanity:","    'true': 0","    'false': 1","","  # Only with enemy_randomizer on (Randomizer section below): every one of the","  # 67 kinds of regular monster appears somewhere before Mammon's World.","  # Off, some kinds can be left out; a kind that appears nowhere is simply","  # not a check. Either way the seed knows where each monster is, and each","  # one's check is in logic from the earliest area it appears in.","  ensure_all_enemies:","    'true': 1","    'false': 0","  spiritsanity:","    'true': 1","    'false': 0","","  # The six items the way on waits for: the Earth Orb, Wind Jade, Water","  # Jewel and Fire Ruby the bosses drop, and the Eletale's Book and Dark Gaol","  # Key the Shannons hand over.","  # normal        each stays on its boss or Shannon, as in the game","  # shuffled      shuffled with everything else","  # progressive   a \"Progressive Boss Item\" for each in the pool, each the","  #               next of Earth Orb, Wind Jade, Water Jewel, Fire Ruby,","  #               Eletale's Book, Dark Gaol Key (five, without the Book, when","  #               mammon_portal replaces it)","  boss_items:","    normal: 1","    shuffled: 0","    progressive: 0","","  # The doors, boats and teleporters the four gems lock are open from the","  # start, so the world can be explored in any order. The Dark Gaol Key still","  # locks the endgame, and so does the Eletale's Book unless mammon_portal","  # replaces it.","  open_world:","    'false': 1","    'true': 0","","  # Extra \"Level Up\" items on top of the one per spirit, 0 to 99. Nothing is","  # added to the game world "","  # Bosses are not in the game until their Soul turns up: an empty arena you","  # walk straight through, the same state the game uses for a boss already","  # beaten. The Soul is an Archipelago item, not one the game knows about, so","  # it can be anywhere in the multiworld. Whether a boss is there is settled","  # as his arena loads, so a Soul that arrives while you are standing in one","  # takes effect the next time you walk in. Souls open nothing else: the","  # gem locks stay locked unless open_world is on, and with boss_items normal","  # a gem waits on its boss's Soul.","  #","  # off           every boss is where the game puts him","  # bosses        the seven before Mammon need Souls","  # with_mammon   Mammon needs one as well, so the last fight waits on it","  boss_souls:","    off: 1","    bosses: 0","    with_mammon: 0","","  # What finishes the run.","  #","  # mammon      beat King Mammon","  # page_hunt   find pages_required Torn Pages of the Eletale's Book (set","  #             pages_required below, anywhere from 5 to 100). The moment the","  #             last one is in your bag, the game fades into the credits and","  #             the goal is done","  goal:","    mammon: 1","    page_hunt: 0","","  # Page Hunt: how many Torn Pages finish the run (5 to 100); with a pages","  # mammon_portal, how many open Mammon's World. They take the","  # place of filler, then wings, then Level Ups; if there is still not room","  # for them all the seed will not generate and says why, so switch on more","  # of the *sanity options for a big hunt.","  pages_required: 20","","  # Page Hunt or a pages mammon_portal: where the Torn Pages can be.","  #","  # quest64_only       only in Quest 64's own locations","  # all_games          anywhere in the multiworld","  # other_games_only   only in the other games' locations; needs at least one","  #                    other game in the seed with room for them all","  page_placement:","    quest64_only: 0","    all_games: 1","    other_games_only: 0","","  # Traps take the place of filler (herbs, potions and the like) in your","  # pool, as Ocarina of Time's Ice Traps do. The pool does not grow, and a","  # trap never replaces a gem, the Book, the key, a Soul, wings or a Level Up.","  #","  # no_traps            none","  # normal              about 1 filler item in 10","  # extra               about 1 in 4","  # mayhem              about half","  # onslaught           every filler item","  # custom_count        exactly trap_count traps (as many as there is filler for)","  # custom_percentage   trap_percentage percent of the filler","  traps:","    no_traps: 1","    normal: 0","    extra: 0","    mayhem: 0","    onslaught: 0","    custom_count: 0","    custom_percentage: 0","","  # With traps: custom_count, how many (0 to 300).","  trap_count: 10","","  # With traps: custom_percentage, the share of the filler (0 to 100).","  trap_percentage: 20","","  # Which kinds of trap can turn up. With all four off there are no traps.","  #","  # Death Trap   Brian falls and is sent back to his last save point, as a","  #              DeathLink death does. Held until a won battle's rewards are","  #              in hand. The most brutal, so it has its own amount:","  #                off      none","  #                rare     a quarter as likely as each other kind (about 1","  #                         trap in 13 with all four on)","  #                normal   as likely as the others","  #                custom   exactly death_trap_count of them","  # HP Trap      HP drops by half of max HP; it stops at 1, never kills.","  # MP Trap      MP drops by half of max MP.","  # Ice Trap     Brian is frozen in ice for five seconds, in the field or in","  #              battle: no moving, attacking, casting, talking or opening.","  death_traps:","    off: 0","    rare: 1","    normal: 0","    custom: 0","","  # With death_traps: custom, exactly this many of the traps are Death Traps","  # (0 to 50  Barrier: Magic Barrier holds two turns longer, as in the Japanese","  # release.","  jp_magic_barrier:","    'true': 1","    'false': 0","","  # JP Boss MP Rewards: Beating a boss raises max MP as well as max HP and","  # refills both, by the amounts the Japanese release uses (5, 5, 5, 10, 10,","  # 15, 15).","  jp_boss_mp_rewards:","    'true': 1","    'false': 0","","  # Fast MP Recovery: MP comes back as you walk at the fastest rate, as in","  # Easy Mode.","  fast_mp_recovery:","    'true': 1","    'false': 0","","  # Real Time Combat: Real time battles instead of turn based: Brian moves,","  # attacks and casts whenever he likes, and the monsters act on timers of","  # their own.","  real_time_combat:","    'false': 1","    'true': 0","","  # Character: Who you play as. leonardo: the blond knight of Normoon and","  # Brannoch Castle, with his own cape, moving with all of Brian's animations;","  # the Leonardo you meet becomes Brian.","  character:","    brian: 1","    leonardo: 0","","  # Repel: Start with a Repel: use it in the field to switch random battles","  # off, use it again to switch them back on. Its icon shows over Brian while","  # it is on.","  repel:","    'true': 1","    'false': 0","","  # JP Stat Up Effect: A colour burst over Brian when a stat rises, as in the","  # Japanese release.","  jp_stat_up_effect:","    'true': 1","    'false': 0","","  # Exit from Anywhere: The bound Exit Spell control warps out of an area","  # without the spell or the MP.","  exit_from_anywhere:","    'true': 1","    'false': 0","","  # Fast Walking: Brian walks 50% faster.","  fast_walking:","    'true': 1","    'false': 0","","  # Text Improvements: Merrow's clearer wording for a number of the game's","  # messages.","  text_improvements:","    'true': 1","    'false': 0","","  # Faster Areas: Fast Monastery, Fast Blue Cave, Fast Shamwood and Fast","  # Mammon's World together: the long empty stretches are skipped.","  faster_areas:","    'true': 1","    'false': 0","","  # Wings Never Expire: Using a pair of wings does not use them up.","  wings_never_expire:","    'true': 1","    'false': 0","","  # No Enemy Drop Limit: Monsters keep dropping items past the vanilla limit.","  no_enemy_drop_limit:","    'true': 1","    'false': 0","","  # ==== Cosmetics","","  # Text Palette: The colour of the text boxes.","  text_palette:","    off: 1","    randomized: 0","","  # Staff Palette: The colour of Brian's staff.","  staff_palette:","    off: 1","    randomized: 0","","  # Cloak Colour: The colour of Brian's cloak.","  cloak_colour:","    off: 1","    randomized: 0","","  # Brian's Clothes: The colours of Brian's clothes.","  brian_clothes:","    off: 1","    randomized: 0","","  # Spell Palettes: The colours of the spell effects.","  spell_palettes:","    off: 1","    randomized: 0","  progression_balancing: 50","  accessibility: full"],"worldVersion":"1.10.0"};
const options = DATA.options;

// ---------------------------------------------------------------- the yaml

function trim(s) { return s.replace(/^[ \t\r]+|[ \t\r]+$/g, ""); }
function unquote(s) {
  s = trim(s);
  if (s.length >= 2 && (s[0] === "'" || s[0] === '"') && s[s.length - 1] === s[0]) s = s.slice(1, -1);
  return s;
}

function choiceIndex(o, name) {
  let n = unquote(name);
  // A toggle may also be written as yes/no or on/off.
  if (o.kind === "toggle") {
    const lower = n.toLowerCase();
    if (lower === "yes" || lower === "on" || lower === "1") n = "true";
    if (lower === "no" || lower === "off" || lower === "0") n = "false";
    if (lower === "true" || lower === "false") n = lower;
  }
  return o.choices.findIndex(c => c.name === n);
}

// Reads the options out of yaml lines. Only the "Quest 64 Recompiled:"
// section counts; anything not recognised is left at what `out` held.
function readYaml(lines, out) {
  let inGame = false;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].replace(/\r$/, "");
    if (line.startsWith("name:")) { out.name = unquote(line.slice(5)); continue; }
    if (line.length && line[0] !== " " && line[0] !== "#") { inGame = trim(line) === "Quest 64 Recompiled:"; continue; }
    if (!inGame || line.length < 3 || line[0] !== " " || line[1] !== " " || line[2] === " " || line[2] === "#") continue;
    const colon = line.indexOf(":");
    if (colon < 0) continue;
    const key = trim(line.slice(2, colon));
    const rest = trim(line.slice(colon + 1));
    const k = options.findIndex(o => o.key === key);
    if (k < 0) continue;
    const o = options[k];
    // The candidates: a scalar, or the block of weighted entries below.
    const entries = [];
    if (rest.length && rest[0] !== "#") {
      entries.push([rest, 1]);
    } else {
      for (let j = i + 1; j < lines.length; j++) {
        const sub = lines[j].replace(/\r$/, "");
        if (!trim(sub).length || trim(sub)[0] === "#") continue;
        if (!sub.startsWith("    ")) break;
        const c = sub.lastIndexOf(":");
        if (c < 0) continue;
        entries.push([trim(sub.slice(0, c)), parseFloat(sub.slice(c + 1)) || 0]);
      }
    }
    // The highest weight wins; ties go to the first.
    let best = -1;
    for (const [name, weight] of entries) {
      if (weight <= best) continue;
      if (o.kind === "range") {
        const n = parseInt(unquote(name), 10);
        if (!isNaN(n)) { out.value[k] = Math.min(o.max, Math.max(o.min, n)); best = weight; }
      } else {
        const idx = choiceIndex(o, name);
        if (idx >= 0) { out.value[k] = idx; best = weight; }
      }
    }
    if (best >= 0) out.found++;
  }
}

function defaults() {
  const v = { name: "", value: options.map(() => 0), found: 0 };
  readYaml(DATA.template, v);
  v.name = "";   // the template's "Player{number}" is not a name
  return v;
}

// The template with the chosen values written in.
function buildYaml(v) {
  const lines = DATA.template.slice();
  let inGame = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("name:")) { lines[i] = "name: " + v.name; continue; }
    if (line.length && line[0] !== " " && line[0] !== "#") { inGame = trim(line) === "Quest 64 Recompiled:"; continue; }
    if (!inGame || line.length < 3 || !line.startsWith("  ") || line[2] === " " || line[2] === "#") continue;
    const key = line.slice(2, line.indexOf(":"));
    const k = options.findIndex(o => o.key === key);
    if (k < 0) continue;
    const o = options[k];
    if (o.scalar) {
      lines[i] = "  " + key + ": " + (o.kind === "range" ? String(v.value[k]) : o.choices[v.value[k]].name);
    } else {
      for (let j = i + 1; j < lines.length && lines[j].startsWith("    "); j++) {
        const c = lines[j].lastIndexOf(":");
        const name = unquote(lines[j].slice(4, c));
        lines[j] = lines[j].slice(0, c + 1) + (name === o.choices[v.value[k]].name ? " 1" : " 0");
      }
    }
  }
  return lines.map(l => l + "\n").join("");
}

// ---------------------------------------------------------------- the page

let values = defaults();
const controls = [];   // per option: { input, number }
const tip = document.getElementById("tip");
let tipTimer = 0;

function showTip(text, x, y) {
  tip.textContent = text;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y + 20;
  if (left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - w - 8);
  if (top + h > window.innerHeight - 8) top = Math.max(8, y - h - 12);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
function hideTip() { clearTimeout(tipTimer); tip.style.display = "none"; }
function addTip(el, text) {
  el.addEventListener("mouseenter", e => {
    clearTimeout(tipTimer);
    const x = e.clientX, y = e.clientY;
    tipTimer = setTimeout(() => showTip(text, x, y), 300);
  });
  el.addEventListener("mouseleave", hideTip);
  el.addEventListener("mousedown", hideTip);
}

function build() {
  const page = document.getElementById("page");
  DATA.groups.forEach((group, g) => {
    const members = options.map((o, k) => k).filter(k => options[k].group === g);
    if (!members.length) return;
    const section = document.createElement("section");
    section.className = "group";
    const h = document.createElement("h2");
    h.textContent = group;
    section.appendChild(h);
    const cols = document.createElement("div");
    cols.className = "columns";
    // As the window does: the first half down the left, the rest the right.
    const perColumn = Math.ceil(members.length / 2);
    const left = document.createElement("div"), right = document.createElement("div");
    left.className = right.className = "column";
    cols.append(left, right);
    members.forEach((k, m) => {
      const o = options[k];
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = o.title;
      const control = document.createElement("div");
      control.className = "control";
      let input, number = null;
      if (o.kind === "range") {
        input = document.createElement("input");
        input.type = "range";
        input.min = o.min;
        input.max = o.max;
        input.step = 1;
        number = document.createElement("span");
        number.className = "number";
        input.addEventListener("input", () => {
          values.value[k] = parseInt(input.value, 10);
          number.textContent = input.value;
        });
        control.append(input, number);
      } else {
        input = document.createElement("select");
        o.choices.forEach((c, i) => input.add(new Option(c.label, String(i))));
        input.addEventListener("change", () => { values.value[k] = parseInt(input.value, 10); });
        control.append(input);
      }
      input.setAttribute("aria-label", o.title);
      const text = o.title + "\n\n" + o.tip;
      addTip(label, text);
      addTip(input, text);
      row.append(label, control);
      (m < perColumn ? left : right).appendChild(row);
      controls[k] = { input, number };
    });
    section.appendChild(cols);
    page.appendChild(section);
  });
}

function show() {
  document.getElementById("name").value = values.name;
  options.forEach((o, k) => {
    const c = controls[k];
    c.input.value = String(values.value[k]);
    if (c.number) c.number.textContent = String(values.value[k]);
  });
}

function readName() { values.name = trim(document.getElementById("name").value); }

async function save() {
  readName();
  const nameBox = document.getElementById("name");
  if (!values.name) {
    alert("Enter your player (slot) name first. It is how the room knows you, and what you type into the game's Archipelago tab.");
    nameBox.focus();
    return;
  }
  if (/[:#{}\[\]]/.test(values.name)) {
    alert("A player name cannot contain : # { } [ or ].");
    nameBox.focus();
    return;
  }
  const text = buildYaml(values);
  const suggested = values.name + ".yaml";
  const done = "Put it in Archipelago's Players folder (with quest64.apworld in custom_worlds) and generate.";
  // Chrome and Edge: a real "Save as" box, so the player picks the folder.
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [{ description: "YAML files", accept: { "text/yaml": [".yaml"] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      alert("Saved " + handle.name + "\n\n" + done);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;   // cancelled
    }
  }
  // Elsewhere a download, which goes where the browser keeps downloads (or
  // asks, if it is set to).
  const url = URL.createObjectURL(new Blob([text], { type: "text/yaml" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = suggested;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  alert("Saved " + suggested + " to your downloads.\n\n" + done);
}

function openFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const v = defaults();
    readYaml(String(reader.result).split("\n"), v);
    if (v.found === 0) {
      alert("That file has no \"Quest 64 Recompiled:\" options in it.");
      return;
    }
    if (v.name === "Player{number}") v.name = "";
    values = v;
    show();
  };
  reader.readAsText(file);
}

build();
show();
document.getElementById("name").addEventListener("input", readName);
document.getElementById("name").addEventListener("keydown", e => { if (e.key === "Enter") save(); });
document.getElementById("save").addEventListener("click", save);
document.getElementById("defaults").addEventListener("click", () => {
  readName();
  const name = values.name;
  values = defaults();
  values.name = name;
  show();
});
const fileInput = document.getElementById("file");
document.getElementById("open").addEventListener("click", () => { fileInput.value = ""; fileInput.click(); });
fileInput.addEventListener("change", () => { if (fileInput.files.length) openFile(fileInput.files[0]); });

// For testing the reader and writer without a person at the page:
// yaml-builder.html#convert=<base64 of a yaml> (or #convert=- for the
// defaults) puts what Save would write into <pre id="converted">.
if (location.hash.startsWith("#convert=")) {
  const arg = location.hash.slice(9);
  const v = defaults();
  if (arg !== "-") readYaml(decodeURIComponent(escape(atob(arg))).split("\n"), v);
  if (!v.name) v.name = "Tester";
  const pre = document.createElement("pre");
  pre.id = "converted";
  pre.textContent = buildYaml(v);
  document.body.appendChild(pre);
}
</script>
