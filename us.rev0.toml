# Config file for Quest 64 Recompilation

[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
# elf_path = "quest64.elf"
rom_file_path = "quest64.us.z64"
symbols_file_path = "Quest64Syms/dump.toml"
output_func_path = "RecompiledFuncs"

[patches]
stubs = [
    "func_800471B0", #some libleo function
    "func_8004793C", #another libleo function
    "initPFSPaks", #is this ever actually called??
    "func_8003C530",
]

ignored = [
    "__osBlockSum",
    "__osPfsReleasePages",
    "__osPfsDeclearPage",
]

[[patches.hook]]
func = "func_80024690"
text = "load_overlays(ctx->r4, ctx->r5, ctx->r6);"
before_vram = 0x80024690

[[patches.hook]]
func = "dma_write"
text = "load_overlays(ctx->r4, ctx->r5, ctx->r6);"
before_vram = 0x80024260

# Run queued cheats (map warp, stat edits) once per frame of every game-mode loop.
[[patches.hook]]
func = "func_80026658"
text = "quest64_cheats_frame(rdram, ctx); quest64_status_watch_frame(rdram);"
before_vram = 0x80026658
# Custom music volume: func_80026554 sets both sequence players' volume
# from a level in a0 (0-255); the hook scales it while a custom file plays.
[[patches.hook]]
func = "func_80026554"
text = "quest64_audio_music_volume(rdram, ctx);"
before_vram = 0x80026554
# Faster walking: scale Brian's per-frame velocity (player struct +0x18/+0x20,
# passed in a1) on entry to the collision/move routine and restore it before
# the routine's single `jr $ra`, so the handlers never see the scaled value.
[[patches.hook]]
func = "func_80005748"
text = "quest64_enh_walk_scale(rdram, ctx);"
before_vram = 0x80005748
[[patches.hook]]
func = "func_80005748"
text = "quest64_enh_walk_unscale(rdram, ctx);"
before_vram = 0x80005A08

# Audio tab. Music shuffle "All": remap the track a0 wherever the game starts
# music by number (UpdateBGM above, and its fading twin here); the map table
# rows are rewritten in the ROM instead. Sound effect shuffle: every effect,
# queued or direct, ends in func_80025B8C with its id in a0.
[[patches.hook]]
func = "func_800267F8"
text = "quest64_audio_bgm(rdram, ctx);"
before_vram = 0x800267F8
[[patches.hook]]
func = "func_80025B8C"
text = "quest64_audio_sfx(rdram, ctx);"
before_vram = 0x80025B8C
# The second sequence player's jingles, started by track number.
[[patches.hook]]
func = "func_800263A8"
text = "quest64_audio_jingle(rdram, ctx);"
before_vram = 0x800263A8

# Randomizer "Wings never expire" (also part of Easier Quest). func_80021524
# removes a used item when its handler (func_800212E4) returned non-zero;
# this sits on the test.
[[patches.hook]]
func = "func_80021524"
text = "quest64_randomizer_wings_never_expire(rdram, ctx);"
before_vram = 0x800220DC

# Post-process each frame's display list for widescreen just before the
# graphics task is loaded; a0 holds the NUScTask at this point.
[[patches.hook]]
func = "nnScExecuteGraphics"
text = "quest64_widescreen_task(rdram, ctx);"
before_vram = 0x80000B08

# Randomizer Stage 2 (native hooks): options that patch code, not data, so
# the ROM-write path (Merrow's Write records applied at boot) can't reach
# them once N64Recomp has baked the vanilla immediates into C literals.
# See src/game/randomizer/native_hooks.cpp for how each address was found.

# Encounter rate: override the step size just before it's used (mtc1 reads
# the register the previous lui set; this replaces that value).
[[patches.hook]]
func = "func_8001C5F4"
text = "quest64_randomizer_encounter_step(ctx); quest64_hardmode_encounter_step(rdram, ctx);"
before_vram = 0x8001C654
# Same function: override the roll/max just before get_rand(max) is called
# and the roll-adjusted counter is stored.
[[patches.hook]]
func = "func_8001C5F4"
text = "quest64_randomizer_encounter_roll_max(ctx); quest64_hardmode_encounter_roll(rdram, ctx);"
before_vram = 0x8001C690

# Walking MP regen amount, before the store that commits it.
[[patches.hook]]
func = "func_80002F60"
text = "quest64_randomizer_walk_mp_regain(ctx); quest64_hardmode_walk_mp_regain(rdram, ctx);"
before_vram = 0x8000385C
# MP regained per staff hit, before the store that commits it.
[[patches.hook]]
func = "func_80004448"
text = "quest64_randomizer_staff_hit_mp(ctx);"
before_vram = 0x800044DC

# Element level cap, raised from 50 to 99. The EXP-table gate and the level-up
# gate in func_800074A0, then the "all elements maxed" value used by that
# function and by the overworld spirit grab in func_80002F60.
[[patches.hook]]
func = "func_800074A0"
text = "quest64_randomizer_element_exp_gate(ctx);"
before_vram = 0x8000790C
[[patches.hook]]
func = "func_800074A0"
text = "quest64_randomizer_element_growth_cap(ctx);"
before_vram = 0x80007948
[[patches.hook]]
func = "func_800074A0"
text = "quest64_randomizer_element_all_maxed(ctx);"
before_vram = 0x80007964
[[patches.hook]]
func = "func_80002F60"
text = "quest64_randomizer_element_spirit_grab(ctx); quest64_hardmode_spirit_cap(rdram, ctx);"
before_vram = 0x800032D8
# The four per-element gates, all the same shape.
[[patches.hook]]
func = "func_8001F3DC"
text = "quest64_randomizer_element_cap(ctx); quest64_hardmode_element_cap(rdram, ctx);"
before_vram = 0x8001F700
[[patches.hook]]
func = "func_8001F3DC"
text = "quest64_randomizer_element_cap(ctx); quest64_hardmode_element_cap(rdram, ctx);"
before_vram = 0x8001F740
[[patches.hook]]
func = "func_8001F3DC"
text = "quest64_randomizer_element_cap(ctx); quest64_hardmode_element_cap(rdram, ctx);"
before_vram = 0x8001F780
[[patches.hook]]
func = "func_8001F3DC"
text = "quest64_randomizer_element_cap(ctx); quest64_hardmode_element_cap(rdram, ctx);"
before_vram = 0x8001F7C8

# Enemy drop limit: skip the write that marks a drop slot used up.
[[patches.hook]]
func = "func_80002F60"
text = "quest64_randomizer_drop_limit(ctx); quest64_hardmode_drop_lock(rdram, ctx);"
before_vram = 0x800036B0

# Wings indoors / on the Isle of Skye, both in the "may wings be used here"
# check, before each branch that would disable them.
[[patches.hook]]
func = "func_800222B4"
text = "quest64_randomizer_wings_indoors(ctx); quest64_hardmode_wings_indoors(rdram, ctx);"
before_vram = 0x800222CC
[[patches.hook]]
func = "func_800222B4"
text = "quest64_randomizer_wings_skye(ctx); quest64_hardmode_wings_skye(rdram, ctx);"
before_vram = 0x800222E4

# Disable Beigis's special map check when boss order moved him out of his arena.
[[patches.hook]]
func = "func_8001C8C4"
text = "quest64_randomizer_beigis_map_check(ctx);"
before_vram = 0x8001C8DC

# Speedrun timer. func_80007A50 calls the message display with
# gMsg_Shannon_Mammon_has_been_destroyed (0x80054C04) once Mammon is down, so
# hooking that call is the exact end of a run.
[[patches.hook]]
func = "func_80007A50"
text = "quest64_speedrun_stop(ctx); quest64_hardmode_scripted_message_4(rdram, ctx);"
before_vram = 0x80007B44

# Runs every frame the title screen is up. The run starts on the first frame
# after it stops running, which is when New (or Continue) has been chosen.
[[patches.hook]]
func = "func_801000A8_ovl_title"
text = "quest64_speedrun_title_frame();"
before_vram = 0x801000A8

# Hard Mode (Landmine36's hack, see src/game/hardmode/). One hook per
# instruction the hack rewrites in the game's code; hooks.cpp documents each.
# All of them return immediately unless Hard Mode is active. Sites the hack
# shares with a randomizer hook above carry both calls on that hook.

# Whole functions the hack replaces with C code in its payload: hooked at
# the entry, the recompiled payload function runs and the original returns.
[[patches.hook]]
func = "func_800074A0"
text = "if (quest64_hardmode_replace_800074A0(rdram, ctx)) return;"
before_vram = 0x800074A0
[[patches.hook]]
